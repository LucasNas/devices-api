spring:
  application:
    name: devices-api-kotlin-reactive

server:
  port: 8081

kafka:

  bootstrap-servers: kafka:9092
  topic:
    devices: devices.events

  enabled: false


---
spring:
  config:
    activate:
      on-profile: default

  r2dbc:
    url: r2dbc:postgresql://localhost:5433/devicesdb_rx
    username: devices
    password: devices

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:5433/devicesdb_rx
    user: devices
    password: devices

management:
  endpoints:
    web:
      exposure:
        include: health,info


---
spring:
  config:
    activate:
      on-profile: docker

  r2dbc:
    url: r2dbc:postgresql://kotlin-db:5432/devicesdb_rx
    username: devices
    password: devices

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://kotlin-db:5432/devicesdb_rx
    user: devices
    password: devices

---
spring:
  config:
    activate:
      on-profile: kafka

kafka:
  enabled: true

services:
  kotlin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devicesdb_rx
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
    ports:
      - "5433:5432"
    volumes:
      - kotlin_dbdata:/var/lib/postgresql/data

  kotlin-app:
    build: .
    depends_on:
      - kotlin-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"

volumes:
  kotlin_dbdata:
